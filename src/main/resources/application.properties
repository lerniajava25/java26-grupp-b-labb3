spring.application.name=java26-gruppb-labb3
spring.datasource.url=jdbc:h2:file:./data/snow-clearing;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB

storage.s3.endpoint=${GARAGE_S3_ENDPOINT:http://localhost:3900}
storage.s3.region=${GARAGE_S3_REGION:garage}
storage.s3.bucket=${GARAGE_S3_BUCKET:snow-clearing}
storage.s3.access-key=${GARAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${GARAGE_S3_SECRET_KEY:}
